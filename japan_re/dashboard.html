<title>Chuo–Kamakura Property Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F4F5F1;--panel:#FFFFFF;--ink:#1C2320;--muted:#5C6660;--line:#DDE0D8;--soft:#ECEEE8;
  --ai:#27467B;--ai-soft:#E3E9F3;--kaki:#C0532A;--kaki-soft:#F6E4DA;
  --chuo:#F15A22;--yoko:#0F6CB6;--good:#2B7A4B;--warn:#A86E12;--bad:#AE3A2D;--grey:#8A938D;
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --paper:#111614;--panel:#19201D;--ink:#E5E9E3;--muted:#99A49D;--line:#2C3531;--soft:#212925;
  --ai:#93AEDC;--ai-soft:#233047;--kaki:#E3845C;--kaki-soft:#3A261D;--good:#6DC18F;--warn:#E0B45C;--bad:#E57B6E;--grey:#76807A;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;
  --paper:#111614;--panel:#19201D;--ink:#E5E9E3;--muted:#99A49D;--line:#2C3531;--soft:#212925;
  --ai:#93AEDC;--ai-soft:#233047;--kaki:#E3845C;--kaki-soft:#3A261D;--good:#6DC18F;--warn:#E0B45C;--bad:#E57B6E;--grey:#76807A;--shadow:none}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:14px/1.55 var(--sans);padding-inline:16px;padding-block:0 48px;margin:0}
.wrap{max-width:1180px;margin:0 auto}
a{color:var(--ai)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.jp{font-family:var(--serif);color:var(--muted)}
[hidden]{display:none!important}

/* header + section tabs */
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding-block:18px 12px}
h1{font:700 20px/1.2 var(--serif);margin:0}
h1 span{font:400 12px var(--sans);color:var(--muted);margin-left:8px}
.tabs{display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:10px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button b{font:500 12px var(--mono);margin-left:6px;opacity:.8}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* toolbar */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);padding-block:8px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.bar .line{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar input[type=search]{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px}
.bar select,.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;cursor:pointer}
.btn[aria-pressed="true"]{border-color:var(--ai);color:var(--ai);background:var(--ai-soft)}
.btn .n{font:500 11px var(--mono);background:var(--ai);color:var(--panel);border-radius:999px;padding:0 6px;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:var(--panel)}
.chip .ja{opacity:.7;margin-left:4px;font-size:11px}
.summary{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;color:var(--muted)}
.summary b{color:var(--ink);font-size:15px}
.linkbtn{border:0;background:none;color:var(--ai);cursor:pointer;padding:0;text-decoration:underline;font-size:13px}

/* more filters panel */
.more-f{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.fgroup{display:grid;gap:6px;align-content:start}
.fgroup>label,.fgroup>.lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--ai)}
.check{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}

/* new this week strip */
.fresh{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;background:var(--kaki-soft);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:12px}
.fresh b{color:var(--kaki)}
.fresh button{border:1px solid var(--kaki);background:var(--panel);color:var(--kaki);border-radius:999px;padding:2px 12px;cursor:pointer}

/* map */
.mapbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:12px}
.maphead{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.maphead .tabs button{padding:3px 10px;font-size:13px}
.legend{display:flex;gap:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
svg.map{display:block;width:100%;height:auto;max-height:440px;background:var(--paper)}
svg.map .ring{fill:var(--ai);fill-opacity:.05;stroke:var(--ai);stroke-opacity:.35;stroke-dasharray:4 4}
svg.map .ring.sec{stroke-opacity:.18;fill-opacity:.02}
svg.map .stn{fill:var(--panel);stroke:var(--ink);stroke-width:2}
svg.map .slab{fill:var(--ink);font:700 13px var(--sans);paint-order:stroke;stroke:var(--paper);stroke-width:4px}
svg.map .slab tspan.ja{font:600 12px var(--serif);fill:var(--muted)}
svg.map .pt{cursor:pointer;stroke:var(--panel);stroke-width:1.2}
svg.map .pt.p{fill:var(--ai)}
svg.map .pt.l{fill:var(--kaki)}
svg.map .pt.sel{stroke:var(--ink);stroke-width:3}
svg.map .scale{stroke:var(--muted);stroke-width:2}
svg.map .stext{fill:var(--muted);font:11px var(--mono)}

/* results: compact cards */
.listhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:18px 0 10px}
.listhead h2{font:700 17px var(--serif);margin:0}
.listhead select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:var(--shadow);text-align:left;padding:0}
.card:hover{border-color:var(--ai)}
.card.sel{border-color:var(--ai);box-shadow:0 0 0 2px var(--ai-soft)}
.thumb{aspect-ratio:4/3;background:var(--soft);position:relative;display:grid;place-items:center;color:var(--muted);font-size:12px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .badge{position:absolute;left:8px;top:8px;background:var(--kaki);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px}
.thumb .count{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font:500 11px var(--mono);border-radius:999px;padding:1px 8px}
.cbody{padding:10px 12px 12px;display:grid;gap:4px}
.price{font:500 18px var(--mono)}
.price small{font:400 12px var(--serif);color:var(--muted);margin-left:6px}
.drop{color:var(--good);font-size:12px;margin-left:6px;font-family:var(--sans)}
.facts{font-size:13px}
.where{font-size:12px;color:var(--muted)}
.flags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.tag{font-size:11px;border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--ink)}
.tag.bad{background:var(--kaki-soft);color:var(--bad)}
.tag.cat{background:var(--kaki-soft);color:var(--kaki);font-weight:700}
.tag.rv{background:var(--ai-soft);color:var(--ai)}
.more{display:block;margin:16px auto 0;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 18px;cursor:pointer}
.empty{grid-column:1/-1;padding:28px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:12px}
footer{margin-top:28px;font-size:12px;color:var(--muted)}

/* detail panel */
dialog.dp{border:0;padding:0;margin:0 0 0 auto;width:min(620px,100vw);max-width:none;height:100dvh;max-height:none;background:var(--panel);color:var(--ink);box-shadow:-8px 0 30px rgba(0,0,0,.2)}
dialog.dp::backdrop{background:rgba(0,0,0,.35)}
.dp .dhead{position:sticky;top:0;background:var(--panel);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);z-index:1}
.dp .close{border:0;background:var(--soft);border-radius:50%;width:36px;height:36px;font-size:20px;cursor:pointer}
.dp .dbody{padding:16px;display:grid;gap:14px}
.gallery{display:flex;gap:6px;overflow-x:auto}
.gallery img{height:240px;width:auto;max-width:none;flex:none;border-radius:8px;cursor:zoom-in;background:var(--soft)}
@media (max-width:600px){.gallery img{height:200px}}
.dp h3{font:700 13px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 16px;font-size:13px}
.kv div span{display:block;font-size:11px;color:var(--muted)}
.ind{display:grid;gap:3px;font-size:13px}
.ind b{font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--grey)}
.dot.g{background:var(--good)}.dot.y{background:var(--warn)}.dot.r{background:var(--bad)}
.contact{display:grid;gap:4px;font-size:13px;background:var(--soft);border-radius:8px;padding:10px 12px}
.contact small{color:var(--muted)}
.sel-all{user-select:all}
details.desc summary{cursor:pointer;color:var(--ai);font-size:13px}
details.desc p{margin:6px 0 0;line-height:1.7}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}

/* photo viewer */
dialog.lb{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100vw;height:100dvh;margin:0}
dialog.lb::backdrop{background:rgba(0,0,0,.88)}
dialog.lb .in{display:grid;place-items:center;width:100%;height:100%;padding:48px 8px}
dialog.lb img{width:min(96vw,1000px);max-height:calc(100dvh - 120px);object-fit:contain;border-radius:6px;cursor:zoom-out}
dialog.lb button{position:fixed;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:26px;line-height:1;width:44px;height:44px;border-radius:50%;cursor:pointer}
dialog.lb .x{top:12px;right:12px}
dialog.lb .pv{left:12px;top:50%}
dialog.lb .nx{right:12px;top:50%}
dialog.lb .cap{position:fixed;bottom:14px;left:0;right:0;text-align:center;color:#fff;font-size:13px}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s,box-shadow .15s}}
@media (max-width:600px){.cards{grid-template-columns:1fr}.bar{position:static}}
</style>

<div class="wrap">
<header>
  <h1>Property board<span>Chuo Line &amp; Kamakura · 物件ボード</span></h1>
  <div class="tabs" role="tablist" id="tabs"></div>
</header>

<div class="bar">
  <div class="line">
    <input type="search" id="q" placeholder="Search: 鎌倉, 古民家, 4LDK…" aria-label="Search">
    <select id="price" aria-label="Max price"></select>
    <select id="walk" aria-label="Max walk to the main station"></select>
    <button class="btn" id="morebtn" aria-pressed="false" aria-controls="moref">More filters</button>
    <button class="btn" id="mapbtn" aria-pressed="false">Map</button>
  </div>
  <div class="chips" id="areas" aria-label="Areas"></div>
</div>

<div class="more-f" id="moref" hidden>
  <div class="fgroup"><label for="land">Min land</label><input type="range" id="land" min="0" max="300" step="10"><b class="num" id="landv"></b></div>
  <div class="fgroup"><span class="lab">Type</span><div class="chips" id="types"></div></div>
  <div class="fgroup"><span class="lab">Condition</span><div class="chips" id="conds"></div></div>
  <div class="fgroup" id="catwrap"><span class="lab">Lead category</span><div class="chips" id="cats"></div></div>
  <div class="fgroup"><span class="lab">Other areas</span><div class="chips" id="areas2"></div></div>
  <div class="fgroup"><span class="lab">Also</span>
    <label class="check"><input type="checkbox" id="freehold"> Freehold only (所有権)</label>
    <label class="check" id="watchwrap"><input type="checkbox" id="watch"> Include watchlist</label>
  </div>
</div>

<div class="fresh" id="fresh" hidden></div>

<section class="mapbox" id="mapbox" aria-label="Map" hidden>
  <div class="maphead">
    <div class="tabs" id="regions"></div>
    <div class="legend"><span><i style="background:var(--kaki)"></i>Lead</span><span><i style="background:var(--ai)"></i>Other</span><span><i style="border:1px dashed var(--ai)"></i>30-min walk</span></div>
  </div>
  <svg class="map" id="map" role="img" aria-label="Listings around the main stations"></svg>
</section>

<div class="listhead">
  <div class="summary"><b id="count"></b><span id="active"></span><button class="linkbtn" id="reset" hidden>Clear filters</button></div>
  <select id="sort" aria-label="Sort">
    <option value="weight">Best first</option>
    <option value="price">Cheapest first</option>
    <option value="-price">Most expensive first</option>
    <option value="m2">Lowest ¥ per m² of land</option>
    <option value="land">Largest land</option>
    <option value="walk">Shortest walk</option>
    <option value="new">Newest</option>
  </select>
</div>
<div class="cards" id="cards"></div>
<button class="more" id="more" hidden>Show more</button>
<footer id="foot"></footer>
</div>

<dialog class="dp" id="dp" aria-label="Listing details"><div class="dhead"><div id="dptitle"></div><button class="close" id="dpx" aria-label="Close">×</button></div><div class="dbody" id="dpbody"></div></dialog>
<dialog class="lb" id="lb" aria-label="Photo"><div class="in"><img id="lbimg" alt=""></div><button class="x" id="lbx" aria-label="Close">×</button><button class="pv" id="lbp" aria-label="Previous photo">‹</button><button class="nx" id="lbn" aria-label="Next photo">›</button><div class="cap" id="lbcap"></div></dialog>
<script>
const D = /*__DATA__*/null;
const TYPE = {detached_house:['House','一戸建て'],traditional_house:['Traditional house','日本家屋'],kominka:['Kominka','古民家'],machiya:['Machiya','町家'],land:['Land','土地'],entire_building:['Whole building','一棟'],mixed_use:['Shop + home','店舗付住宅'],condominium:['Apartment','マンション'],other:['Other','その他']};
const COND = {move_in_ready:['Move-in ready','即入居可'],minor_renovation:['Light refresh','軽微な改修'],major_renovation:['Major renovation','大規模改修'],full_renovation:['Full renovation','全面改修'],derelict_rebuild:['Rebuild / land value','建替え前提'],unknown:['Unknown','不明']};
const SRC = {suumo:'SUUMO',real_kamakura:'Real Kamakura',real_tokyo:'Real Tokyo',ieichiba:'Ieichiba'};
const AREA_JA = Object.fromEntries(D.stations.map(s=>[s.area,s.ja]));
const PRIMARY = D.stations.filter(s=>s.tier==='primary').map(s=>s.area);
const SECONDARY = D.stations.filter(s=>s.tier!=='primary').map(s=>s.area).concat(['Elsewhere']);
const REGIONS = [
  {id:'chuo',name:'Chuo Line',ja:'中央線',areas:['Kichijoji','Mitaka','Koenji','Nakano','Higashi-Nakano','Shin-Nakano'],rail:['Mitaka','Kichijoji','Koenji','Nakano','Higashi-Nakano'],line:'var(--chuo)'},
  {id:'kama',name:'Kamakura',ja:'鎌倉',areas:['Kamakura','Kita-Kamakura'],rail:['Kita-Kamakura','Kamakura'],line:'var(--yoko)'},
];
// Sections. Apartments are leads of their own, kept out of the house and land Leads. Small buildings
// are every whole building (一棟, 2-4 storeys with their land) in the areas, lead or not.
const FLAT_CAT = 'Apartments', BLDG_CAT = 'Small Buildings', NEW_CAT = 'New or Changed (last 7 days)';
const BLDG_TYPES = new Set(['entire_building','mixed_use']);
const isFlat = l => (l.categories||[]).includes(FLAT_CAT);
const isBldg = p => BLDG_TYPES.has(p.property_type) || (p.categories||[]).includes(BLDG_CAT);
const TABS = [['leads','Leads'],['flats','Apartments'],['bldg','Small buildings'],['all','All listings']];
const byId = new Map(D.properties.map(p=>[p.property_id,p]));
const leadById = new Map(D.leads.map(l=>[l.property_id,l]));
const PAGE = 24;
const defaults = () => ({tab:'leads',q:'',areas:new Set(PRIMARY),price:150,walk:30,land:0,types:new Set(),conds:new Set(),cats:new Set(),freehold:false,watch:false,sort:'weight',region:'chuo',sel:null,shown:PAGE,map:false,more:false});
let S = defaults();
const store = (k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}, load = k=>{try{return localStorage.getItem(k)}catch(e){return null}};
{const t=load('jre-tab'); if(TABS.some(x=>x[0]===t)) S.tab=t; if(load('jre-map')==='1') S.map=true;}
if(location.hash==='#all') S.tab='all';
if(S.tab==='all'||S.tab==='bldg') S.sort='price';

const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yen = n => n==null?'–':'¥'+(n>=1e8?(n/1e8).toFixed(2).replace(/0$/,'')+'億':(n/1e6).toFixed(1)+'M');
const man = n => n==null?'':(n/1e4).toLocaleString('en')+'万円';
const tsubo = m => (m/3.30579).toFixed(1)+'坪';
const typeEn = p => (TYPE[p.property_type]||TYPE.other)[0];

// Walk to the area's main station (what the 30-min rule is about), else to the nearest station.
function walkMin(p){ const m=/(\d+) min walk/.exec(p.main_station||(p.lead&&p.lead.main_station)||''); return m?+m[1]:p.station_walk_min; }
function merged(l){ return Object.assign({}, byId.get(l.property_id)||{}, l); }
function withLead(p){ return leadById.has(p.property_id)?Object.assign({},p,{lead:leadById.get(p.property_id)}):p; }
const leadOf = p => S.tab==='leads'||S.tab==='flats' ? p : p.lead;
function base(tab){
  if(tab==='leads'||tab==='flats') return D.leads.filter(l=>isFlat(l)===(tab==='flats')&&(S.watch||l.is_lead)).map(merged);
  if(tab==='bldg') return D.properties.filter(isBldg).map(withLead);
  return D.properties.map(withLead);
}
function pass(p){
  if(!S.areas.has(p.area||'Elsewhere')) return false;
  if(p.price_jpy>S.price*1e6) return false;
  if(S.walk<30){const w=walkMin(p); if(w==null||w>S.walk) return false;}
  if(S.land && !(p.land_area_m2>=S.land)) return false;
  if(S.types.size && !S.types.has(p.property_type)) return false;
  if(S.conds.size && !S.conds.has(p.condition||'unknown')) return false;
  if(S.freehold && p.land_rights!=='freehold') return false;
  if(S.cats.size && !((leadOf(p)||{}).categories||[]).some(c=>S.cats.has(c))) return false;
  const q=S.q.trim().toLowerCase();
  if(q){const L=leadOf(p)||{}; const hay=[p.title_ja,p.address_ja,p.neighborhood_ja,p.municipality,p.municipality_ja,p.area,p.layout_ja,L.reason,p.condition_evidence,p.nearest_station,(TYPE[p.property_type]||[]).join(' ')].join(' ').toLowerCase(); if(!hay.includes(q)) return false;}
  return true;
}
function rows(){ return base(S.tab).filter(pass).sort(sorter()); }
function sorter(){
  const n=v=>v==null?Infinity:v;
  return {
    weight:(a,b)=>(b.is_lead===true)-(a.is_lead===true)||n(-(a.weight??-1e9))-n(-(b.weight??-1e9))||a.price_jpy-b.price_jpy,
    price:(a,b)=>a.price_jpy-b.price_jpy,
    '-price':(a,b)=>b.price_jpy-a.price_jpy,
    m2:(a,b)=>n(a.price_per_m2_land)-n(b.price_per_m2_land),
    land:(a,b)=>n(-a.land_area_m2)-n(-b.land_area_m2),
    walk:(a,b)=>n(walkMin(a))-n(walkMin(b)),
    'new':(a,b)=>String(b.first_seen).localeCompare(String(a.first_seen)),
  }[S.sort];
}

// ---- filters
function chipRow(el, items, set){
  el.innerHTML = items.map(([v,en,ja])=>`<button class="chip" data-v="${esc(v)}" aria-pressed="${set.has(v)}">${esc(en)}${ja?`<span class="ja">${esc(ja)}</span>`:''}</button>`).join('');
  el.onclick = e=>{const b=e.target.closest('.chip'); if(!b) return; const v=b.dataset.v; set.has(v)?set.delete(v):set.add(v); b.setAttribute('aria-pressed',set.has(v)); S.shown=PAGE; update();};
}
function setupFilters(){
  const st = a => D.stations.find(s=>s.area===a);
  chipRow($('areas'), PRIMARY.map(a=>[a,a,st(a).ja]), S.areas);
  chipRow($('areas2'), SECONDARY.map(a=>[a,a,a==='Elsewhere'?'その他':st(a).ja]), S.areas);
  const tc=new Set(D.properties.map(p=>p.property_type));
  chipRow($('types'), Object.keys(TYPE).filter(t=>tc.has(t)).map(t=>[t,TYPE[t][0],TYPE[t][1]]), S.types);
  chipRow($('conds'), Object.keys(COND).map(c=>[c,COND[c][0],COND[c][1]]), S.conds);
  const cats=[...new Set(D.leads.flatMap(l=>l.categories||[]))].filter(c=>c!==FLAT_CAT&&c!=='Watchlist');
  chipRow($('cats'), cats.map(c=>[c,c.replace(' Opportunities','').replace(' Properties','').replace(' (last 7 days)','')]), S.cats);
  $('price').innerHTML=[20,30,40,50,60,70,80,100,120,150].map(v=>`<option value="${v}">${v===150?'Any price':'Up to ¥'+v+'M'}</option>`).join('');
  $('walk').innerHTML=[30,25,20,15,10].map(v=>`<option value="${v}">${v===30?'Any walk (≤ 30 min)':'≤ '+v+' min walk'}</option>`).join('');
  $('q').value=S.q; $('price').value=S.price; $('walk').value=S.walk; $('land').value=S.land; $('freehold').checked=S.freehold; $('watch').checked=S.watch; $('sort').value=S.sort;
}
let raf=0; const soon=()=>{cancelAnimationFrame(raf); raf=requestAnimationFrame(update);};
$('q').oninput=e=>{S.q=e.target.value;S.shown=PAGE;soon();};
$('price').onchange=e=>{S.price=+e.target.value;S.shown=PAGE;update();};
$('walk').onchange=e=>{S.walk=+e.target.value;S.shown=PAGE;update();};
$('land').oninput=e=>{S.land=+e.target.value;S.shown=PAGE;soon();};
$('freehold').onchange=e=>{S.freehold=e.target.checked;update();};
$('watch').onchange=e=>{S.watch=e.target.checked;update();};
$('sort').onchange=e=>{S.sort=e.target.value;update();};
$('reset').onclick=()=>{const keep={tab:S.tab,region:S.region,map:S.map,more:S.more,sort:S.sort}; S=Object.assign(defaults(),keep); setupFilters(); update();};
$('more').onclick=()=>{S.shown+=PAGE;update();};
$('morebtn').onclick=()=>{S.more=!S.more;update();};
$('mapbtn').onclick=()=>{S.map=!S.map;store('jre-map',S.map?'1':'0');update();};
function setTab(t){S.tab=t;S.shown=PAGE;S.cats.clear();S.sort=(t==='leads'||t==='flats')?'weight':(S.sort==='weight'?'price':S.sort);store('jre-tab',t);$('sort').value=S.sort;setupFilters();update();}
$('tabs').onclick=e=>{const b=e.target.closest('button'); if(b) setTab(b.dataset.t);};

// Filters that differ from the defaults, said in words, so it's clear why a list is short.
function activeFilters(){
  const d=defaults(), out=[];
  const extra=[...S.areas].filter(a=>!d.areas.has(a)), off=[...d.areas].filter(a=>!S.areas.has(a));
  if(off.length||extra.length) out.push([...S.areas].join(', ')||'no area');
  if(S.price<150) out.push('≤ ¥'+S.price+'M');
  if(S.walk<30) out.push('≤ '+S.walk+' min walk');
  if(S.land) out.push('≥ '+S.land+' m² land');
  S.types.forEach(t=>out.push(TYPE[t][0])); S.conds.forEach(c=>out.push(COND[c][0])); S.cats.forEach(c=>out.push(c.replace(' (last 7 days)','')));
  if(S.freehold) out.push('freehold'); if(S.q.trim()) out.push('“'+S.q.trim()+'”');
  return out;
}

// ---- map: an equirectangular sketch around the main stations, to scale
function regionOf(p){ return REGIONS.find(r=>r.areas.includes(p.area)) || (p.lat&&p.lat<35.5?REGIONS[1]:p.lat?REGIONS[0]:null); }
function geometry(reg){
  const st = D.stations.filter(s=>reg.areas.includes(s.area));
  const lat0 = st.reduce((a,s)=>a+s.lat,0)/st.length, k=Math.cos(lat0*Math.PI/180);
  const rLat = D.radius_m/111320*1.08, rLng = rLat/k;
  const minLng=Math.min(...st.map(s=>s.lng))-rLng, maxLng=Math.max(...st.map(s=>s.lng))+rLng;
  const minLat=Math.min(...st.map(s=>s.lat))-rLat, maxLat=Math.max(...st.map(s=>s.lat))+rLat;
  const W=1000, sc=W/((maxLng-minLng)*k), H=Math.round((maxLat-minLat)*sc);
  return {st,W,H,sc,x:lng=>(lng-minLng)*k*sc,y:lat=>(maxLat-lat)*sc,inside:(la,ln)=>la>=minLat&&la<=maxLat&&ln>=minLng&&ln<=maxLng};
}
function drawMap(list){
  const reg = REGIONS.find(r=>r.id===S.region), g=geometry(reg);
  const rpx = D.radius_m/111320*g.sc;
  const stns = reg.rail.map(a=>g.st.find(t=>t.area===a));
  let s = `<polyline points="${stns.map(t=>g.x(t.lng)+','+g.y(t.lat)).join(' ')}" fill="none" stroke="${reg.line}" stroke-width="5" stroke-linecap="round" opacity=".85"/>`;
  s += g.st.map(t=>`<circle class="ring ${t.tier==='secondary'?'sec':''}" cx="${g.x(t.lng)}" cy="${g.y(t.lat)}" r="${rpx}"/>`).join('');
  const onMap = list.filter(p=>p.lat&&g.inside(p.lat,p.lng));
  const pts = onMap.slice().sort((a,b)=>(a.property_id===S.sel)-(b.property_id===S.sel));
  s += pts.map(p=>{const L=leadOf(p), lead=L&&L.is_lead; return `<circle class="pt ${lead?'l':'p'} ${p.property_id===S.sel?'sel':''}" data-id="${p.property_id}" cx="${g.x(p.lng).toFixed(1)}" cy="${g.y(p.lat).toFixed(1)}" r="${p.property_id===S.sel?9:6}"><title>${esc(yen(p.price_jpy)+' · '+typeEn(p)+' · '+(p.title_ja||''))}</title></circle>`}).join('');
  s += g.st.map(t=>`<circle class="stn" cx="${g.x(t.lng)}" cy="${g.y(t.lat)}" r="6"/><text class="slab" x="${g.x(t.lng)+(g.x(t.lng)>g.W-190?-10:10)}" y="${g.y(t.lat)-10}" text-anchor="${g.x(t.lng)>g.W-190?'end':'start'}">${esc(t.area)} <tspan class="ja">${esc(t.ja)}</tspan></text>`).join('');
  const km = g.sc*1000/111320, y0=g.H-18;
  s += `<line class="scale" x1="20" y1="${y0}" x2="${20+km}" y2="${y0}"/><text class="stext" x="20" y="${y0-6}">1 km</text>`;
  const svg=$('map'); svg.setAttribute('viewBox',`0 0 ${g.W} ${g.H}`); svg.innerHTML=s;
  $('regions').innerHTML = REGIONS.map(r=>`<button data-r="${r.id}" aria-selected="${r.id===S.region}">${r.name} <b>${list.filter(p=>regionOf(p)===r).length}</b></button>`).join('');
}
$('regions').onclick=e=>{const b=e.target.closest('button'); if(b){S.region=b.dataset.r;drawMap(rows());}};
$('map').onclick=e=>{const c=e.target.closest('.pt'); if(c) openDetail(+c.dataset.id);};

// ---- compact cards: photo, price, the key facts, at most three flags
function facts(p){
  const b=[typeEn(p)];
  if(p.floors_above&&p.property_type!=='land') b.push(`${p.floors_above} storey${p.floors_above>1?'s':''}`);
  if(p.land_area_m2&&p.property_type!=='condominium') b.push(`${Math.round(p.land_area_m2)} m² land`);
  else if(p.building_area_m2) b.push(`${Math.round(p.building_area_m2)} m²`);
  if(p.year_built&&p.year_built>1900) b.push(`built ${p.year_built}`);
  return b.join(' · ');
}
function flags(p,L){
  const f=[];
  if(L&&L.main_category) f.push(`<span class="tag cat">${esc(L.is_lead?L.main_category.replace(' Opportunities','').replace(' Properties',''):'Watchlist')}</span>`);
  if(L&&L.review) f.push(`<span class="tag rv">${esc(L.review)}</span>`);
  if(p.land_rights==='leasehold') f.push(`<span class="tag bad">Leasehold</span>`);
  if(p.rebuild_prohibited) f.push(`<span class="tag bad">No rebuild</span>`);
  return f.slice(0,3).join('');
}
function card(p){
  const L=leadOf(p), isNew=L&&(L.categories||[]).includes(NEW_CAT);
  const w=walkMin(p), drop=p.initial_price_jpy&&p.initial_price_jpy>p.price_jpy;
  const ph=p.photos||[];
  return `<button class="card ${p.property_id===S.sel?'sel':''}" data-id="${p.property_id}">
    <div class="thumb">${ph.length?`<img src="${ph[0]}" alt="" loading="lazy">`:esc(typeEn(p))}${isNew?'<span class="badge">New this week</span>':''}${ph.length>1?`<span class="count">${ph.length} photos</span>`:''}</div>
    <div class="cbody">
      <div><span class="price">${yen(p.price_jpy)}<small>${man(p.price_jpy)}</small></span>${drop?`<span class="drop">▼ ${yen(p.initial_price_jpy-p.price_jpy)}</span>`:''}</div>
      <div class="facts">${esc(facts(p))}</div>
      <div class="where">${esc(p.area||p.municipality||'')}${w!=null?` · ${w} min walk`:''}</div>
      <div class="flags">${flags(p,L)}</div>
    </div></button>`;
}
$('cards').onclick=e=>{const c=e.target.closest('.card'); if(c) openDetail(+c.dataset.id);};

// ---- detail panel: everything about one listing
const DAYS = {'月':'Mon','火':'Tue','水':'Wed','木':'Thu','金':'Fri','土':'Sat','日':'Sun','祝':'holidays'};
const closedEn = t => /なし|無休/.test(t) ? 'open every day' : 'closed '+t.replace(/毎週|曜日|曜/g,'').split(/[・、,\/]/).map(x=>x.trim()).filter(Boolean).map(x=>[...x].map(c=>DAYS[c]||c).join('')).join(', ');
function contactBlock(c){
  if(!c||!(c.phone||c.emails)) return '';
  const r=[];
  if(c.company) r.push(`<span class="jp">${esc(c.company)}</span>`);
  if(c.person) r.push(`<span>Agent <span class="jp">${esc(c.person)}</span></span>`);
  if(c.phone) r.push(`<span>Phone <b class="num sel-all">${esc(c.phone)}</b>${/^0120|^0800/.test(c.phone)?' <small>(freephone, Japan only)</small>':` <small>(from abroad +81 ${esc(c.phone.replace(/^0/,''))})</small>`}</span>`);
  (c.emails||[]).forEach(e=>r.push(`<span>Email <b class="sel-all">${esc(e)}</b></span>`));
  if(c.hours) r.push(`<span>Hours ${esc(c.hours)}${c.closed?`, ${esc(closedEn(c.closed))}`:''} (Japan time)</span>`);
  return `<section><h3>Contact the agent</h3><div class="contact">${r.join('')}<small>Say you saw it on SUUMO (「SUUMOを見た」).</small></div></section>`;
}
const dotClass = d => ({'🟢':'g','🟡':'y','🔴':'r'}[d]||'');
function find(id){ const l=leadById.get(id), p=byId.get(id); return l?Object.assign({},p||{},l,{lead:l}):p&&withLead(p); }
function openDetail(id){
  const p=find(id); if(!p) return; S.sel=id;
  const L=p.lead, cond=COND[p.condition||'unknown']||COND.unknown, ph=p.photos||[], w=walkMin(p);
  const kv=[['Price',`${yen(p.price_jpy)} <span class="jp">${man(p.price_jpy)}</span>`],['Type',`${esc(typeEn(p))} <span class="jp">${esc((TYPE[p.property_type]||TYPE.other)[1])}</span>`],
    ['Land',p.land_area_m2?`${Math.round(p.land_area_m2)} m² (${tsubo(p.land_area_m2)})`:''],['Building',p.building_area_m2?`${Math.round(p.building_area_m2)} m²`:''],
    ['Storeys',p.floors_above||''],['Layout',esc(p.layout_ja||'')],['Built',p.year_built>1900?p.year_built:''],['Condition',`${esc(cond[0])} <span class="jp">${esc(cond[1])}</span>`],
    ['Land rights',p.land_rights==='leasehold'?'<b style="color:var(--bad)">Leasehold 借地権</b>':p.land_rights==='freehold'?'Freehold 所有権':''],
    ['Nearest station',[(p.nearest_station||'').split(' / ').pop().trim(),p.station_walk_min!=null?p.station_walk_min+' min walk':''].filter(Boolean).map(esc).join(' · ')],['Main station',esc(p.main_station||(L&&L.main_station)||'')],
    ['¥ per m² land',p.price_per_m2_land?`¥${Math.round(p.price_per_m2_land/1e3).toLocaleString('en')}k`:''],['Est. all-in purchase',p.est_acquisition_cost_jpy?yen(p.est_acquisition_cost_jpy):''],
    ['Price cut',p.initial_price_jpy>p.price_jpy?`${yen(p.initial_price_jpy)} → ${yen(p.price_jpy)}`:''],['First seen',String(p.first_seen||'').slice(0,10)]].filter(x=>x[1]);
  const links=(p.links||[{source:'listing',url:p.primary_url}]).filter(l=>l.url).map((l,i,a)=>{const n=a.filter(x=>x.source===l.source), k=n.indexOf(l); return `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(SRC[l.source]||l.source)}${n.length>1?' '+(k+1):''} ↗</a>`});
  if(p.lat) links.push(`<a href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}" target="_blank" rel="noopener">Google Maps ↗</a>`);
  $('dptitle').innerHTML=`<span class="price">${yen(p.price_jpy)}</span> <span class="where">${esc(p.area||p.municipality||'')}${w!=null?` · ${w} min walk`:''}</span>`;
  $('dpbody').innerHTML = `
    ${ph.length?`<div class="gallery">${ph.map((d,i)=>`<img src="${d}" data-i="${i}" alt="Photo ${i+1}, tap to enlarge">`).join('')}</div>`:''}
    <div><div style="font-weight:700">${esc(facts(p))}</div><div class="jp">${esc(p.title_ja||'')}${p.address_ja?` ／ ${esc(p.address_ja)}`:''}</div><div class="flags" style="margin-top:6px">${flags(p,L)}</div></div>
    ${L&&L.reason?`<section><h3>Why it's here</h3><div>${esc(L.reason)}</div></section>`:''}
    <section><h3>Key facts</h3><div class="kv">${kv.map(([k,v])=>`<div><span>${k}</span>${v}</div>`).join('')}</div></section>
    ${L&&L.indicators?`<section><h3>Checks</h3><div class="ind">${Object.entries(L.indicators).map(([k,v])=>`<span><i class="dot ${dotClass(v.dot)}"></i><b>${esc(k)}</b> ${esc(v.text)}</span>`).join('')}</div></section>`:''}
    ${contactBlock(p.contact)}
    ${p.description_en?`<details class="desc"><summary>Full listing in English</summary><p>${esc(p.description_en)}</p></details>`:''}
    ${p.description_ja?`<details class="desc"><summary>${p.description_en?'Original Japanese':'Full listing text (Japanese)'}</summary><p class="jp">${esc(p.description_ja)}</p></details>`:''}
    <section><h3>Links</h3><div class="links">${links.join('')}</div></section>
    <div class="where">Listing #${p.property_id}${p.sources?` · via ${esc(p.sources.replace(/,/g,', '))}`:''}</div>`;
  $('dp').showModal(); $('dpbody').scrollTop=0; $('dp').scrollTop=0;
  if(S.map){const r=regionOf(p); if(r) S.region=r.id;} update();
}
$('dpx').onclick=()=>$('dp').close();
$('dp').onclick=e=>{ if(e.target===$('dp')) $('dp').close(); const im=e.target.closest('.gallery img'); if(im) openPhoto(S.sel,+im.dataset.i); };
$('dp').onclose=()=>{S.sel=null; update();};

// ---- photo viewer
let LB={id:null,i:0};
function showPhoto(){ const p=find(LB.id), ph=(p&&p.photos)||[]; LB.i=(LB.i+ph.length)%ph.length;
  $('lbimg').src=ph[LB.i]; $('lbimg').alt=`Photo ${LB.i+1} of listing #${LB.id}`;
  $('lbcap').textContent=`${LB.i+1} / ${ph.length} · ${yen(p.price_jpy)} · ${p.title_ja||''}`;
  $('lbp').hidden=$('lbn').hidden=ph.length<2; }
function openPhoto(id,i){ LB={id,i}; showPhoto(); $('lb').showModal(); }
$('lbx').onclick=()=>$('lb').close();
$('lbp').onclick=()=>{LB.i--;showPhoto();}; $('lbn').onclick=()=>{LB.i++;showPhoto();};
$('lb').onclick=e=>{if(e.target===$('lb')||e.target.classList.contains('in')||e.target.id==='lbimg') $('lb').close();};
$('lb').onkeydown=e=>{if(e.key==='ArrowLeft'){LB.i--;showPhoto();} if(e.key==='ArrowRight'){LB.i++;showPhoto();}};

// ---- new this week: one line, a toggle to show only those
function drawFresh(){
  const box=$('fresh'), lead=S.tab==='leads'||S.tab==='flats';
  const n = lead ? D.leads.filter(l=>l.is_lead&&isFlat(l)===(S.tab==='flats')&&(l.categories||[]).includes(NEW_CAT)).length : 0;
  box.hidden = !n; if(!n) return;
  const on = S.cats.size===1&&S.cats.has(NEW_CAT);
  box.innerHTML = `<span><b>${n} new or changed</b> in the last 7 days</span><button id="freshonly">${on?'Show all':'Show only these'}</button>`;
  $('freshonly').onclick=()=>{S.cats=on?new Set():new Set([NEW_CAT]); if(!on){S.areas=new Set(PRIMARY.concat(SECONDARY));} S.shown=PAGE; setupFilters(); update();};
}

function update(){
  const list = rows();
  $('tabs').innerHTML = TABS.map(([t,name])=>`<button role="tab" data-t="${t}" aria-selected="${S.tab===t}">${name}<b>${base(t).filter(pass).length}</b></button>`).join('');
  $('catwrap').hidden = $('watchwrap').hidden = S.tab==='all'||S.tab==='bldg';
  $('sort').querySelector('[value=weight]').hidden = S.tab==='all'||S.tab==='bldg';
  $('landv').textContent = S.land?'≥ '+S.land+' m²':'any';
  $('moref').hidden = !S.more; $('morebtn').setAttribute('aria-pressed',S.more);
  const nMore = S.types.size+S.conds.size+S.cats.size+(S.land?1:0)+(S.freehold?1:0)+[...S.areas].filter(a=>SECONDARY.includes(a)).length;
  $('morebtn').innerHTML = 'More filters'+(nMore?`<span class="n">${nMore}</span>`:'');
  $('mapbox').hidden = !S.map; $('mapbtn').setAttribute('aria-pressed',S.map); $('mapbtn').textContent = S.map?'Hide map':'Map';
  const noun = {leads:'leads',flats:'apartment leads',bldg:'small buildings',all:'listings'}[S.tab];
  $('count').textContent = `${list.length.toLocaleString('en')} ${list.length===1?noun.replace(/s$/,'').replace('buildings','building'):noun}`;
  const act = activeFilters(); $('active').textContent = act.length?'· '+act.join(' · '):''; $('reset').hidden = !act.length;
  const empty = S.tab==='flats'&&!D.leads.some(isFlat) ? 'No apartment leads yet. The daily crawl adds them.'
    : S.tab==='bldg'&&!D.properties.some(isBldg) ? 'No small buildings listed yet. The daily crawl adds them.'
    : 'Nothing matches. Try “Clear filters”.';
  $('cards').innerHTML = list.length ? list.slice(0,S.shown).map(card).join('') : `<div class="empty">${empty}</div>`;
  $('more').hidden = list.length<=S.shown; $('more').textContent = `Show more (${list.length-S.shown} left)`;
  if(S.map) drawMap(list);
  drawFresh();
  $('foot').textContent = `${D.properties.length.toLocaleString('en')} active listings up to ¥150M · leads are under ¥${D.lead_max/1e6}M within a ${D.walk_max}-min walk of a main station · data as of ${new Date(D.generated).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}. The map is a to-scale sketch; map tiles can't load here.`;
}
setupFilters(); update();
</script>
